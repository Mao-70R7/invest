    function flowSection(title,sub,body,extra=""){return `<section class="panel flow-section"><h3>${title}</h3><p>${sub}</p><div class="vertical-flow">${body}</div>${extra}</section>`}
    function flowNode(role,title,text,detail=""){return `<div class="flow-node ${role}"><strong>${title} <span class="role-mark role-${role}" style="display:inline-flex;margin-left:6px">${role==="manager"?"顾问经理":role==="advisor"?"顾问":"系统处理"}</span></strong><span>${text}</span>${detail}</div>`}

    function arrow(){return `<div class="flow-arrow"></div>`}
    function equalAlgorithmScenarios(){return `<div class="scenario-list">

    function lotteryAlgorithmScenarios(){return `<div class="scenario-list">

    function rotationScenarios(){return `<div class="scenario-list">
      <details open><summary>场景1：跨期继续同一轮</summary><div class="scenario-content"><strong>例：</strong>产品处于第1轮，10名顾问个人轮次都是0。第一期只有3个名额，10人抓阄，3名中签者更新为第1轮；第二期还有5个名额，只在剩余7名仍为第0轮的顾问中抓阄。未中签者下一期仍优先，直到本期参与名单全部跟上第1轮。</div></details>
      <details><summary>场景2：全部跟上后进入下一轮</summary><div class="scenario-content"><strong>例：</strong>第1轮只剩顾问甲、乙尚未跟上，本期有5个名额。先给甲、乙各1个并更新为第1轮，此时全员完成第1轮，产品进入第2轮；剩余3个名额再按本期获配较少者优先处理。</div></details>
      <details><summary>场景3：新顾问和重新参加顾问</summary><div class="scenario-content"><strong>新顾问：</strong>产品当前是第5轮，新顾问没有历史记录，系统把起点设为第4轮；获得1个后直接更新为第5轮，不补前4轮。<br><strong>重新参加：</strong>顾问离开时停在第3轮，回来时产品已到第5轮；获得1个后直接更新为第5轮，不补第4轮。<br><strong>本期不参与：</strong>不进入判断，也不阻塞产品轮次推进，个人轮次保持不变。</div></details>
      <details><summary>场景4：为什么还要看本期获配数</summary><div class="scenario-content"><strong>例：</strong>甲、乙、丙已跟上第5轮，丁、戊停在第4轮，本期18个名额。先给丁、戊各1个跟到第5轮；产品进入第6轮后，先给本期仍为0个的甲、乙、丙，再给丁、戊。如此循环，最后不足覆盖时只在本期获配较少的人中抓阄，避免丁、戊因刚补齐又继续中签而比别人多两个。</div></details>
      <details><summary>场景5：回收不让个人轮次倒退</summary><div class="scenario-content"><strong>例：</strong>顾问通过第3轮分配获得1个名额，个人轮次已更新为第3轮。预约码后来未使用并被回收，个人轮次仍为第3轮；回池名额重新分配时，不会把该顾问当成第3轮未跟进人员。</div></details>
      <details><summary>场景6：名额不足覆盖优先组</summary><div class="scenario-content"><strong>例：</strong>产品处于第4轮，有8名顾问仍在第3轮且本期获配同为0个，但只剩3个名额。系统只在这8人中抓阄3人；中签者更新为第4轮，另外5人保持第3轮，下次继续优先。</div></details>
    </div>`}

    function submitRegistration(){
      const a=account(ui.registrationAccountId);if(!a)return;
      const source=$("#reg-source").value,offline=$("#reg-offline").value.trim(),amount=Number($("#reg-amount").value),note=$("#reg-note").value.trim(),assignedAdvisor=isManager()?$("#reg-advisor").value:ui.operator;

        if(duplicate){duplicates.push(product(productId).name);return}
        const item={id:uid("Q"),customerId:a.id,productId,cycleId:c.id,advisor:assignedAdvisor,source,state:"排队中",amount,registeredAt:nowText(),note,offlineReason:source==="线下登记"?offline:"",codeId:"",logs:[[nowText(),`${ui.operator}通过${source}创建排队登记，所属顾问为${assignedAdvisor}。`]]};

    function invalidateAndReplace(old,destination,reason){

      if(handlers[action])handlers[action]();
    });
    document.addEventListener("change",event=>{
      handleInputChange(event);
      if(event.target.id==="operatorSelect"){ui.operator=event.target.value;if(!isManager()&&ui.view==="products")ui.view="advisor";ui.queueFilters.advisor="";ui.ledgerFilters.advisor="";renderShell()}
      if(event.target.id==="cycleSelector"){ui.selectedCycleId=event.target.value;ui.productTab="cycle";renderProducts()}
      if(event.target.id==="apply-scope"){const value=event.target.value;$("#apply-cycle-field").style.display=value==="cycle"?"block":"none";$("#apply-product-field").style.display=value==="product"?"block":"none";$("#apply-date-field").style.display=value==="dateRange"?"block":"none"}
      if(event.target.id==="reg-source"){$("#offlineReasonField").style.display=event.target.value==="线下登记"?"block":"none"}
      if(event.target.matches("[data-base-status]")){const a=advisor(event.target.dataset.baseStatus);a.baseStatus=event.target.value;logAudit("编辑顾问基础状态",`${a.name} -> ${a.baseStatus}`);save();renderProducts();toast("顾问基础状态已更新，只影响后续未确认批次")}
      if(event.target.matches("[data-default-participation]"))setDefaultParticipation(event.target.dataset.defaultParticipation,event.target.value);
      if(event.target.matches("[data-cycle-participation]"))setCycleParticipation(ui.selectedCycleId,event.target.dataset.cycleParticipation,event.target.value);
      if(event.target.matches("[data-dashboard-participation]"))setCycleParticipation(event.target.dataset.cycleId,event.target.dataset.dashboardParticipation,event.target.value,"经理统计面板");
    });
    document.addEventListener("input",event=>{
      if(event.target.matches(".quota-input"))handleInputChange(event);
      if(event.target.id==="special-customer-search"&&!ui.composition){
        clearTimeout(ui.specialTimer);ui.specialTimer=setTimeout(()=>{const term=event.target.value.trim().toLowerCase(),ids=ui.modal.availableQueueIds.filter(id=>{const q=queue(id),a=account(q.customerId);return `${a.name}${a.phone}${a.cert}${q.advisor}`.toLowerCase().includes(term)});$("#special-customer-list tbody").innerHTML=ids.map(id=>specialCustomerRow(queue(id))).join("")||`<tr><td colspan="6"><div class="empty">没有匹配客户</div></td></tr>`},420);
      }
      if(event.target.id==="add-product-search"&&!ui.composition){
        clearTimeout(ui.addProductTimer);ui.addProductTimer=setTimeout(()=>{const term=event.target.value.trim().toLowerCase(),rows=ui.modal.available.map(product).filter(p=>`${p.code}${p.name}${p.fundManager}`.toLowerCase().includes(term));$("#add-product-list tbody").innerHTML=rows.map(p=>`<tr><td><input type="checkbox" data-add-product="${p.id}" ${ui.modal.productIds.includes(p.id)?"checked":""}></td><td class="code-text">${p.code}</td><td><strong>${p.name}</strong></td><td>${p.fundManager}</td></tr>`).join("")},420);
      }
    });
    document.addEventListener("compositionstart",()=>ui.composition=true);
    document.addEventListener("compositionend",event=>{ui.composition=false;event.target.dispatchEvent(new Event("input",{bubbles:true}))});
    document.addEventListener("keydown",event=>{if(event.key!=="Enter"||ui.composition)return;if(event.target.id==="productQuery"){event.preventDefault();ui.productQuery=event.target.value.trim();ui.productPage=1;renderProducts()}if(event.target.id==="accountLookup"){event.preventDefault();lookupAccount()}if(event.target.id==="reg-product-query"){event.preventDefault();ui.registrationQuery=event.target.value.trim();renderRegistrationInner()}});
    $("#modalLayer").addEventListener("click",event=>{if(event.target===$("#modalLayer"))toast("请使用右上角 × 或底部取消按钮关闭弹窗")});
    renderShell();
    void readIndexedSnapshot().then(record=>{
      if(record?.data?.seedVersion===SEED_VERSION&&Number(record.updatedAt)>Number(db.updatedAt||0)){
        db=record.data;localStorage.setItem(STORAGE_KEY,JSON.stringify(db));renderShell();
      }else{
        void writeIndexedSnapshot(db);
      }
    });
  </script>
</body>
</html>
